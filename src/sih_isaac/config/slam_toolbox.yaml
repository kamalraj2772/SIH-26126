# slam_toolbox (online async) -- sole owner of the map->odom TF edge.
# Lidar SLAM: fully GPS-free localization against the world it maps itself.
# Its live map is published on /map (RViz); the planner's static prior comes
# separately from map_server on /prior_map, derived from the GeoTIFF.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    debug_logging: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    mode: mapping

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.10
    max_laser_range: 25.0
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.25
    scan_buffer_size: 10
    loop_search_maximum_distance: 8.0
    do_loop_closing: true
    correlation_search_space_dimension: 1.0
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
